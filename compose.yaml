name: langy
services:
  reader:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PORT: "8080"
      READER_DATA: /data
      READER_STORAGE_ID: ${READER_STORAGE_ID:-}
      READER_MODEL: ${READER_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      READER_USER: ${READER_USER:-reader}
      READER_PASSWORD: ${READER_PASSWORD:-}
      READER_SYNC_USER: ${READER_SYNC_USER:-}
      READER_SYNC_PASSWORD: ${READER_SYNC_PASSWORD:-}
      READER_DEMO: ${READER_DEMO:-0}
      READER_DEMO_AUDIO_PREVIEW: ${READER_DEMO_AUDIO_PREVIEW:-1}
      OLLAMA_URL: http://ollama:11434
      READER_LANGUAGE_URL: http://language:8000
      READER_ALIGNMENT_MODEL: ${READER_WHISPER_MODEL:-small}
      READER_KOKORO_URL: ${READER_KOKORO_URL:-}
      READER_KOKORO_VOICE: ${READER_KOKORO_VOICE:-ef_dora}
      READER_KOKORO_API_KEY: ${READER_KOKORO_API_KEY:-}
      READER_SEARCH_URL: ${READER_SEARCH_URL:-http://search:8080}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${READER_BIND:-0.0.0.0}:${READER_PORT:-8088}:8080"
    volumes:
      - ${READER_DATA_SOURCE:-library}:/data
    depends_on:
      language:
        condition: service_started
      ollama:
        condition: service_started
    networks: [default, inference]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s

  language:
    build:
      context: ./language
      args:
        WHISPER_MODEL: ${READER_WHISPER_MODEL:-small}
    init: true
    restart: unless-stopped
    networks: [inference]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3

  search:
    build: ./search
    init: true
    restart: unless-stopped
    volumes:
      - search_config:/etc/searxng
      - search_cache:/var/cache/searxng
    networks: [default]
    environment:
      SEARXNG_LIMITER: "false"
      SEARXNG_PUBLIC_INSTANCE: "false"
      GRANIAN_WORKERS: "1"
    logging:
      options:
        max-size: "5m"
        max-file: "2"

  ollama:
    build:
      context: ./ollama
      args:
        READER_MODEL: ${READER_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    init: true
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    networks: [inference]
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  library:
  search_config:
  search_cache:

networks:
  inference:
    internal: true
