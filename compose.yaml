name: langy
services:
  reader:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PORT: "8080"
      READER_DATA: /data
      READER_MODEL: ${READER_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
      READER_USER: ${READER_USER:-reader}
      READER_PASSWORD: ${READER_PASSWORD:-}
      READER_DEMO: ${READER_DEMO:-0}
      OLLAMA_URL: http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${READER_BIND:-0.0.0.0}:${READER_PORT:-8088}:8080"
    volumes:
      - library:/data
    depends_on:
      ollama:
        condition: service_started
    networks: [default, inference]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 4s
      retries: 3
      start_period: 10s

  ollama:
    build:
      context: ./ollama
      args:
        READER_MODEL: ${READER_MODEL:-qwen3:4b-instruct-2507-q4_K_M}
    init: true
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "8"
    networks: [inference]
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama list >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  library:

networks:
  inference:
    internal: true
