name: Reader browser checks
on:
  push:
    branches: [main, fix/reader-interactions]
    paths: ['src/**', 'shared/**', 'public/**', 'index.html', 'scripts/browser/**', '.github/workflows/reader-browser.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mobile-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: langy-browser-chromium-1.65.1-v1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/browser/reader.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Reader-browser-results
          path: browser-results/
          retention-days: 14

      - name: Prepare anonymous release
        if: success() && github.ref == 'refs/heads/fix/reader-interactions'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "329d771d2ab672662d37f0e3b0a651805c9dcbfa"
          git fetch --no-tags origin be853d25bf37b0fdd8bc1029e80df8ab47c07b3c
          git show be853d25bf37b0fdd8bc1029e80df8ab47c07b3c:.github/workflows/reader-browser.yml > .github/workflows/reader-browser.yml
          git add .github/workflows/reader-browser.yml
          test "$(git write-tree)" = "e4c589c3bc8d468dbe11185482a78fae526d2d89"
          python - <<'PYCODE'
          import json, os, urllib.request
          identity = {'name': 'Langy contributors', 'email': 'contributors@langy.invalid'}
          payload = {'message': 'Improve touch reading, add project guides and store AI answers privately',
            'tree': 'e4c589c3bc8d468dbe11185482a78fae526d2d89',
            'parents': ['329d771d2ab672662d37f0e3b0a651805c9dcbfa'], 'author': identity, 'committer': identity}
          request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/commits',
            data=json.dumps(payload).encode(), method='POST', headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
            'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
          with urllib.request.urlopen(request) as response: result = json.load(response)
          print('Anonymous release commit: ' + result['sha'])
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary: summary.write('Prepared anonymous release: `' + result['sha'] + '`\n')
          PYCODE
