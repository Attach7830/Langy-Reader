name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Retain the preview signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: langy-android-preview-signing-v1
      - name: Build installable preview APK
        run: gradle -p android --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Langy-Reader-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
