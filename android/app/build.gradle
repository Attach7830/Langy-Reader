plugins { id 'com.android.application' }
android {
    namespace 'win.srtw.langy'
    compileSdk 35
    defaultConfig { applicationId 'win.srtw.langy'; minSdk 26; targetSdk 35; versionCode 4; versionName '1.3' }
    signingConfigs {
        debug {
            storeFile rootProject.file('.signing/preview.keystore')
            storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        }
    }
    buildTypes { debug { applicationIdSuffix '.preview2' } }
}
